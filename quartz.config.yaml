# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: deanfeed
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true
  prefetch: viewport
  locale: ko-KR
  baseUrl: deanfeed.me
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: NanumSquare Neo
      body: NanumSquare Neo
      code: SF Mono
    colors:
      lightMode:
        light: "#FAF9F5"
        lightgray: "#E8E6DC"
        gray: "#A6A49D"
        darkgray: "#3D3D3A"
        dark: "#1F1E1D"
        secondary: "#C15F3C"
        tertiary: "#D97757"
        highlight: rgba(193, 95, 60, 0.10)
        textHighlight: "#ffd00066"
      darkMode:
        light: "#262624"
        lightgray: "#42413E"
        gray: "#6B6A65"
        darkgray: "#C3C2B7"
        dark: "#E5E4DC"
        secondary: "#D97757"
        tertiary: "#C15F3C"
        highlight: rgba(217, 119, 87, 0.16)
        textHighlight: "#ffd00040"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        deanfeed: https://deanfeed.me
        GitHub: https://github.com/deanfeedme/deanfeedme.github.io
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: full-width
    folder:
      template: full-width
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      template: full-width
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
